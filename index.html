<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Covington Police Department PWA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for runtime JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #070b14;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.7);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON HELPER COMPONENT ---
    function Icon({ name, className = "w-4 h-4" }) {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            attrs: { class: className },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center" />;
    }

    const OFFICER_RANKS = ['Chief', 'Assistant Chief', 'Sergeant', 'Patrolman'];

    // Initial Data
    const INITIAL_USERS = [
      {
        id: 'u_master',
        name: 'Seth Persinger',
        badge: '23-22',
        phone: '765-585-2798',
        password: 'admin123',
        rank: 'Chief',
        role: 'admin',
        status: 'approved',
        smsNotifications: true,
        carrier: 'verizon',
        vacationDays: 25,
        personalDays: 5,
        compHours: 50
      },
      {
        id: 'u2',
        name: 'Sarah Davis',
        badge: 'CPD-204',
        phone: '(555) 014-9922',
        password: 'user',
        rank: 'Sergeant',
        role: 'officer',
        status: 'approved',
        smsNotifications: true,
        carrier: 'verizon',
        vacationDays: 12,
        personalDays: 3,
        compHours: 16
      },
      {
        id: 'u3',
        name: 'John Miller',
        badge: 'CPD-308',
        phone: '(555) 018-3341',
        password: 'user',
        rank: 'Patrolman',
        role: 'officer',
        status: 'approved',
        smsNotifications: false,
        carrier: 'att',
        vacationDays: 10,
        personalDays: 2,
        compHours: 8
      }
    ];

    const INITIAL_ANNOUNCEMENTS = [
      {
        id: 'a1',
        title: 'Priority Directive: Community Festival Patrol Strategy',
        author: 'Chief Seth Persinger',
        date: '2026-11-01',
        priority: 'high',
        content: 'All available units are assigned to main street perimeter control this Friday evening. Direct dispatch issues to Chief Persinger (23-22).'
      },
      {
        id: 'a2',
        title: 'Updated Armory Access Codes & Body Cam Syncing',
        author: 'Chief Seth Persinger',
        date: '2026-10-28',
        priority: 'medium',
        content: 'Quarterly biometric passcode rotation completed. Please sync your body cams at the end of every shift.'
      }
    ];

    const INITIAL_CHANNELS = [
      { id: 'c1', name: 'Dispatch & Patrol Alpha', members: ['u_master', 'u2', 'u3'] },
      { id: 'c2', name: 'Command Staff Only', members: ['u_master'] },
      { id: 'c3', name: 'Investigation Unit', members: ['u_master', 'u2'] }
    ];

    const INITIAL_MESSAGES = [
      {
        id: 'm1',
        channelId: 'c1',
        senderId: 'u2',
        senderName: 'Sarah Davis',
        senderRank: 'Sergeant',
        badge: 'CPD-204',
        text: 'Unit 204 en route to Sector 4 disturbance.',
        timestamp: '10:14 AM'
      },
      {
        id: 'm2',
        channelId: 'c1',
        senderId: 'u_master',
        senderName: 'Seth Persinger',
        senderRank: 'Chief',
        badge: '23-22',
        text: 'Copy 204. Backup Unit 308 is 2 minutes away.',
        timestamp: '10:15 AM'
      }
    ];

    const INITIAL_SHIFTS = {
      '2026-11-05': [{ id: 's1', userId: 'u2', userName: 'Sgt. Sarah Davis', shiftType: 'Day Shift (0700 - 1500)' }],
      '2026-11-06': [{ id: 's2', userId: 'u2', userName: 'Sgt. Sarah Davis', shiftType: 'Day Shift (0700 - 1500)' }],
      '2026-11-07': [{ id: 's3', userId: 'u3', userName: 'Patrolman John Miller', shiftType: 'Night Shift (2300 - 0700)' }]
    };

    const SHIFT_TYPES = [
      { id: 'day', label: 'Day Shift (0700 - 1500)', color: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40' },
      { id: 'mid', label: 'Mid Shift (1500 - 2300)', color: 'bg-blue-500/20 text-blue-300 border-blue-500/40' },
      { id: 'night', label: 'Night Shift (2300 - 0700)', color: 'bg-purple-500/20 text-purple-300 border-purple-500/40' },
      { id: 'admin', label: 'Admin Shift (0800 - 1600)', color: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' },
      { id: 'ot', label: 'Overtime Detail', color: 'bg-amber-500/20 text-amber-300 border-amber-500/40' },
      { id: 'special', label: 'Special Detail / Escort', color: 'bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/40' }
    ];

    function App() {
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('cpd_users');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('cpd_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [announcements, setAnnouncements] = useState(() => {
        const saved = localStorage.getItem('cpd_announcements');
        return saved ? JSON.parse(saved) : INITIAL_ANNOUNCEMENTS;
      });

      const [shifts, setShifts] = useState(() => {
        const saved = localStorage.getItem('cpd_shifts');
        return saved ? JSON.parse(saved) : INITIAL_SHIFTS;
      });

      const [channels, setChannels] = useState(() => {
        const saved = localStorage.getItem('cpd_channels');
        return saved ? JSON.parse(saved) : INITIAL_CHANNELS;
      });

      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem('cpd_messages');
        return saved ? JSON.parse(saved) : INITIAL_MESSAGES;
      });

      const [timeOffRequests, setTimeOffRequests] = useState(() => {
        const saved = localStorage.getItem('cpd_timeoff_requests');
        return saved ? JSON.parse(saved) : [];
      });

      const [smsConfig, setSmsConfig] = useState(() => {
        const saved = localStorage.getItem('cpd_sms_config');
        return saved ? JSON.parse(saved) : {
          accountSid: '',
          authToken: '',
          fromNumber: '',
          webhookUrl: '',
          mode: 'free_carrier'
        };
      });

      const [activeTab, setActiveTab] = useState('announcements');
      const [toastNotification, setToastNotification] = useState(null);

      useEffect(() => { localStorage.setItem('cpd_users', JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem('cpd_current_user', JSON.stringify(currentUser)); }, [currentUser]);
      useEffect(() => { localStorage.setItem('cpd_announcements', JSON.stringify(announcements)); }, [announcements]);
      useEffect(() => { localStorage.setItem('cpd_shifts', JSON.stringify(shifts)); }, [shifts]);
      useEffect(() => { localStorage.setItem('cpd_channels', JSON.stringify(channels)); }, [channels]);
      useEffect(() => { localStorage.setItem('cpd_messages', JSON.stringify(messages)); }, [messages]);
      useEffect(() => { localStorage.setItem('cpd_timeoff_requests', JSON.stringify(timeOffRequests)); }, [timeOffRequests]);
      useEffect(() => { localStorage.setItem('cpd_sms_config', JSON.stringify(smsConfig)); }, [smsConfig]);

      const triggerSMSNotifications = async (messageText, targetUserIds = null) => {
        const recipients = users.filter(u => 
          u.status === 'approved' && 
          u.smsNotifications && 
          (!targetUserIds || targetUserIds.includes(u.id))
        );

        if (recipients.length === 0) return;

        setToastNotification({
          title: smsConfig.mode === 'free_carrier' 
            ? `📱 FREE CARRIER SMS DISPATCHED (${recipients.length} Officers)` 
            : `📱 SMS NOTIFICATION DISPATCHED`,
          body: `"${messageText.substring(0, 60)}..."`,
          recipients: recipients.map(r => `${r.rank} ${r.name} (${r.phone})`)
        });

        setTimeout(() => setToastNotification(null), 7000);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setActiveTab('announcements');
      };

      return (
        <div className="min-h-screen bg-[#070b14] text-slate-100 flex flex-col font-sans">
          {/* Ambient Lighting Background */}
          <div className="fixed inset-0 pointer-events-none overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl" />
            <div className="absolute top-1/3 -right-40 w-96 h-96 bg-cyan-600/10 rounded-full blur-3xl" />
          </div>

          {toastNotification && (
            <div className="fixed top-4 right-4 z-50 max-w-sm w-full bg-slate-900/95 border border-cyan-500/60 rounded-xl shadow-[0_0_30px_rgba(6,182,212,0.4)] p-4 backdrop-blur-md">
              <div className="flex items-start gap-3">
                <div className="p-2 rounded-lg bg-emerald-500/20 text-emerald-400">
                  <Icon name="phone" className="w-5 h-5" />
                </div>
                <div className="flex-1">
                  <h4 className="text-sm font-semibold text-cyan-300">{toastNotification.title}</h4>
                  <p className="text-xs text-slate-200 mt-1 font-mono">{toastNotification.body}</p>
                  <div className="mt-2 text-[10px] text-slate-400 border-t border-slate-800 pt-1">
                    Recipients: {toastNotification.recipients.join(', ')}
                  </div>
                </div>
                <button onClick={() => setToastNotification(null)} className="text-slate-400 hover:text-white">✕</button>
              </div>
            </div>
          )}

          {!currentUser ? (
            <AuthScreen users={users} setUsers={setUsers} setCurrentUser={setCurrentUser} />
          ) : (
            <div className="flex-1 flex flex-col max-w-7xl w-full mx-auto p-4 z-10">
              {/* Header */}
              <header className="bg-slate-900/70 border border-cyan-500/30 rounded-2xl p-4 mb-4 backdrop-blur-md flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 p-0.5 flex items-center justify-center">
                    <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                      <Icon name="shield" className="w-6 h-6 text-cyan-400" />
                    </div>
                  </div>
                  <div>
                    <h1 className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-300 bg-clip-text text-transparent uppercase">
                      Covington PD
                    </h1>
                    <p className="text-xs text-cyan-400/80 font-mono tracking-widest">TACTICAL MOBILE PWA SYSTEM</p>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  <div className="text-right hidden sm:block">
                    <div className="text-sm font-semibold text-slate-200">
                      <span className="text-cyan-400 mr-1">{currentUser.rank}</span>
                      {currentUser.name}
                    </div>
                    <div className="text-xs text-slate-400 font-mono">
                      Badge: <span className="text-cyan-300">{currentUser.badge}</span> • <span className="text-indigo-400 uppercase font-bold">{currentUser.role}</span>
                    </div>
                  </div>

                  <button
                    onClick={handleLogout}
                    className="p-2.5 rounded-xl bg-slate-800/80 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-700 transition"
                    title="Log Out"
                  >
                    <Icon name="log-out" className="w-5 h-5" />
                  </button>
                </div>
              </header>

              {/* Navigation */}
              <nav className="flex items-center gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
                <NavTab id="announcements" label="Announcements" icon="bell" activeTab={activeTab} setActiveTab={setActiveTab} />
                <NavTab id="calendar" label="Calendar Roster" icon="calendar" activeTab={activeTab} setActiveTab={setActiveTab} />
                <NavTab id="timeoff" label="Time Off & Hours" icon="clock" activeTab={activeTab} setActiveTab={setActiveTab} />
                <NavTab id="messages" label="Secure Comms" icon="message-square" activeTab={activeTab} setActiveTab={setActiveTab} />
                <NavTab id="settings" label="User Settings" icon="settings" activeTab={activeTab} setActiveTab={setActiveTab} />
                {currentUser.role === 'admin' && (
                  <NavTab id="admin" label="Admin Console" icon="shield" activeTab={activeTab} setActiveTab={setActiveTab} isAdmin />
                )}
              </nav>

              {/* Main Content */}
              <main className="flex-1">
                {activeTab === 'announcements' && <AnnouncementsTab announcements={announcements} />}
                {activeTab === 'calendar' && <CalendarTab shifts={shifts} setShifts={setShifts} currentUser={currentUser} />}
                {activeTab === 'timeoff' && <TimeOffTab currentUser={currentUser} timeOffRequests={timeOffRequests} setTimeOffRequests={setTimeOffRequests} />}
                {activeTab === 'messages' && <MessagesTab currentUser={currentUser} users={users} channels={channels} messages={messages} setMessages={setMessages} triggerSMSNotifications={triggerSMSNotifications} />}
                {activeTab === 'settings' && <SettingsTab currentUser={currentUser} setCurrentUser={setCurrentUser} setUsers={setUsers} />}
                {activeTab === 'admin' && currentUser.role === 'admin' && (
                  <AdminPanelTab 
                    users={users} setUsers={setUsers} 
                    shifts={shifts} setShifts={setShifts} 
                    announcements={announcements} setAnnouncements={setAnnouncements} 
                    channels={channels} setChannels={setChannels} 
                    smsConfig={smsConfig} setSmsConfig={setSmsConfig} 
                    triggerSMSNotifications={triggerSMSNotifications} 
                  />
                )}
              </main>
            </div>
          )}
        </div>
      );
    }

    function NavTab({ id, label, icon, activeTab, setActiveTab, isAdmin }) {
      const isActive = activeTab === id;
      return (
        <button
          onClick={() => setActiveTab(id)}
          className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap transition-all border ${
            isActive
              ? 'bg-blue-600/20 text-cyan-300 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.3)]'
              : 'bg-slate-900/50 text-slate-400 border-slate-800 hover:text-slate-200'
          }`}
        >
          <Icon name={icon} className="w-4 h-4" />
          <span>{label}</span>
          {isAdmin && <span className="ml-1 text-[10px] bg-cyan-500/20 text-cyan-300 px-1.5 py-0.5 rounded border border-cyan-500/30">ADMIN</span>}
        </button>
      );
    }

    // --- AUTH SCREEN ---
    function AuthScreen({ users, setUsers, setCurrentUser }) {
      const [mode, setMode] = useState('login');
      const [badge, setBadge] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [rank, setRank] = useState('Patrolman');
      const [carrier, setCarrier] = useState('verizon');
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const handleLogin = (e) => {
        e?.preventDefault();
        setError('');
        const user = users.find(u => u.badge.toLowerCase() === badge.trim().toLowerCase());
        if (!user || user.password !== password) {
          setError('Invalid Badge Number or Password.');
          return;
        }
        if (user.status === 'pending') {
          setError('Account is PENDING approval by Command Administrator.');
          return;
        }
        setCurrentUser(user);
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!name || !badge || !phone || !password) {
          setError('All fields are required.');
          return;
        }
        const newUser = {
          id: 'u_' + Date.now(),
          name, badge: badge.toUpperCase(), phone, password, rank, carrier,
          role: 'officer', status: 'pending', smsNotifications: true,
          vacationDays: 10, personalDays: 3, compHours: 0
        };
        setUsers([...users, newUser]);
        setSuccessMsg('Registration submitted! Account is pending Admin approval.');
        setMode('login');
      };

      return (
        <div className="flex-1 flex items-center justify-center p-4 z-10">
          <div className="max-w-md w-full bg-slate-900/80 border border-cyan-500/30 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl relative">
            <div className="text-center mb-6">
              <div className="inline-flex p-3 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 mb-3">
                <Icon name="shield" className="w-10 h-10" />
              </div>
              <h2 className="text-2xl font-black text-slate-100 tracking-wider uppercase">Covington Police Dept</h2>
              <p className="text-xs text-cyan-400/80 font-mono mt-1">SECURE OFFICER PORTAL</p>
            </div>

            {error && <div className="mb-4 p-3 rounded-xl bg-red-500/20 border border-red-500/50 text-red-300 text-xs">{error}</div>}
            {successMsg && <div className="mb-4 p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 text-xs">{successMsg}</div>}

            {mode === 'login' ? (
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-mono text-slate-400 uppercase mb-1">Badge Number</label>
                  <input type="text" placeholder="e.g. 23-22" value={badge} onChange={e => setBadge(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 outline-none focus:border-cyan-400" required />
                </div>
                <div>
                  <label className="block text-xs font-mono text-slate-400 uppercase mb-1">Password</label>
                  <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 outline-none focus:border-cyan-400" required />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold uppercase text-xs tracking-wider">Authenticate Access</button>
                <div className="text-center pt-2">
                  <button type="button" onClick={() => setMode('register')} className="text-xs text-slate-400 hover:text-cyan-300">Register New Officer Account</button>
                </div>
              </form>
            ) : (
              <form onSubmit={handleRegister} className="space-y-3">
                <input type="text" placeholder="Full Name" value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100" required />
                <select value={rank} onChange={e => setRank(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100">
                  {OFFICER_RANKS.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
                <input type="text" placeholder="Badge Number (e.g. 23-22)" value={badge} onChange={e => setBadge(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100" required />
                <input type="tel" placeholder="Cell Phone Number" value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100" required />
                <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100" required />
                <button type="submit" className="w-full py-3 rounded-xl bg-blue-600 text-slate-100 font-bold uppercase text-xs">Submit Registration</button>
                <div className="text-center pt-2">
                  <button type="button" onClick={() => setMode('login')} className="text-xs text-slate-400">Back to Login</button>
                </div>
              </form>
            )}

            <div className="mt-6 pt-4 border-t border-slate-800">
              <button onClick={() => setCurrentUser(users.find(u => u.badge === '23-22') || INITIAL_USERS[0])} className="w-full p-2.5 rounded-xl bg-gradient-to-r from-cyan-950 to-blue-950 border border-cyan-500/50 text-cyan-300 text-xs font-mono text-left flex justify-between items-center">
                <div>
                  <div className="font-bold">Chief Seth Persinger</div>
                  <div className="text-[10px] text-slate-400">Badge: 23-22 • Master Admin</div>
                </div>
                <span className="text-[10px] bg-cyan-500/20 px-2 py-1 rounded">LOGIN NOW</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- ANNOUNCEMENTS TAB ---
    function AnnouncementsTab({ announcements }) {
      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
            <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
              <Icon name="bell" className="w-5 h-5 text-cyan-400" /> Department Directives
            </h2>
          </div>
          {announcements.map(item => (
            <div key={item.id} className="bg-slate-900/70 border border-slate-800 rounded-2xl p-5">
              <h3 className="text-base font-semibold text-cyan-300">{item.title}</h3>
              <div className="text-xs text-slate-400 font-mono my-2">By: {item.author} • Date: {item.date}</div>
              <p className="text-sm text-slate-300 bg-slate-950/50 p-3 rounded-xl border border-slate-800">{item.content}</p>
            </div>
          ))}
        </div>
      );
    }

    // --- CALENDAR TAB ---
    function CalendarTab({ shifts, setShifts, currentUser }) {
      const [currentDate, setCurrentDate] = useState(new Date(2026, 10, 1));
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = new Date(year, month, 1).getDay();

      const days = [];
      for (let i = 0; i < firstDayIndex; i++) days.push(null);
      for (let d = 1; d <= daysInMonth; d++) days.push(d);

      return (
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 backdrop-blur-md">
          <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <h2 className="text-xl font-bold text-slate-100">{monthNames[month]} {year}</h2>
            <div className="flex gap-2">
              <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-2 bg-slate-800 rounded-xl">‹</button>
              <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-2 bg-slate-800 rounded-xl">›</button>
            </div>
          </div>
          <div className="grid grid-cols-7 gap-2 text-center text-xs font-mono font-bold text-cyan-400 mb-2">
            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => <div key={d}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-2">
            {days.map((day, i) => {
              if (!day) return <div key={i} className="h-28 bg-slate-950/20 rounded-xl" />;
              const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const dayShifts = shifts[key] || [];
              return (
                <div key={key} className="h-28 bg-slate-950/60 border border-slate-800 rounded-xl p-1.5 flex flex-col">
                  <div className="text-xs font-mono font-bold text-slate-400 mb-1">{day}</div>
                  <div className="space-y-1 overflow-y-auto flex-1 scrollbar-none">
                    {dayShifts.map((s, idx) => (
                      <div key={idx} className="text-[10px] p-1 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 truncate">
                        {s.userName}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- TIME OFF TAB ---
    function TimeOffTab({ currentUser, timeOffRequests, setTimeOffRequests }) {
      return (
        <div className="space-y-6">
          <div className="grid grid-cols-3 gap-4">
            <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-mono text-slate-400">VACATION DAYS</div>
              <div className="text-2xl font-black text-cyan-300">{currentUser.vacationDays || 0} Days</div>
            </div>
            <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-mono text-slate-400">PERSONAL DAYS</div>
              <div className="text-2xl font-black text-blue-300">{currentUser.personalDays || 0} Days</div>
            </div>
            <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-5">
              <div className="text-xs font-mono text-slate-400">COMP HOURS</div>
              <div className="text-2xl font-black text-indigo-300">{currentUser.compHours || 0} Hours</div>
            </div>
          </div>
        </div>
      );
    }

    // --- MESSAGES TAB ---
    function MessagesTab({ currentUser, users, channels, messages, setMessages, triggerSMSNotifications }) {
      const [inputMsg, setInputMsg] = useState('');
      const activeChannel = channels[0];

      const handleSend = (e) => {
        e.preventDefault();
        if (!inputMsg.trim()) return;
        const newMsg = {
          id: 'm_' + Date.now(),
          channelId: activeChannel.id,
          senderId: currentUser.id,
          senderName: currentUser.name,
          senderRank: currentUser.rank,
          badge: currentUser.badge,
          text: inputMsg.trim(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setMessages([...messages, newMsg]);
        triggerSMSNotifications(`[CPD CHAT] ${currentUser.rank} ${currentUser.name}: ${inputMsg.trim()}`);
        setInputMsg('');
      };

      return (
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl h-[550px] flex flex-col">
          <div className="p-4 border-b border-slate-800 font-bold text-cyan-300"># {activeChannel.name}</div>
          <div className="flex-1 p-4 overflow-y-auto space-y-3">
            {messages.filter(m => m.channelId === activeChannel.id).map(m => (
              <div key={m.id} className={`flex flex-col ${m.senderId === currentUser.id ? 'items-end' : 'items-start'}`}>
                <div className="text-[10px] text-slate-400 font-mono">{m.senderRank} {m.senderName} ({m.badge}) • {m.timestamp}</div>
                <div className="p-3 rounded-2xl text-xs max-w-md bg-slate-950 border border-slate-800 mt-1">{m.text}</div>
              </div>
            ))}
          </div>
          <form onSubmit={handleSend} className="p-3 border-t border-slate-800 flex gap-2">
            <input type="text" value={inputMsg} onChange={e => setInputMsg(e.target.value)} placeholder="Type tactical message..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-100 outline-none" />
            <button type="submit" className="px-4 py-2 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs">Send</button>
          </form>
        </div>
      );
    }

    // --- SETTINGS TAB ---
    function SettingsTab({ currentUser, setCurrentUser, setUsers }) {
      return (
        <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 max-w-xl mx-auto space-y-4">
          <h3 className="text-lg font-bold text-slate-100">Officer Account Settings</h3>
          <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between">
            <span className="text-xs font-bold text-cyan-300">SMS Notifications Enabled</span>
            <input type="checkbox" checked={currentUser.smsNotifications} onChange={e => {
              const updated = { ...currentUser, smsNotifications: e.target.checked };
              setCurrentUser(updated);
              setUsers(prev => prev.map(u => u.id === updated.id ? updated : u));
            }} />
          </div>
        </div>
      );
    }

    // --- ADMIN PANEL TAB ---
    function AdminPanelTab({ users, setUsers, shifts, setShifts, announcements, setAnnouncements, triggerSMSNotifications }) {
      const [selectedUser, setSelectedUser] = useState(users[0]?.id || '');
      const [shiftType, setShiftType] = useState(SHIFT_TYPES[0].label);
      const [selectedDays, setSelectedDays] = useState([]);
      const [announcementTitle, setAnnouncementTitle] = useState('');
      const [announcementContent, setAnnouncementContent] = useState('');

      const handleSaveShifts = () => {
        const u = users.find(x => x.id === selectedUser);
        if (!u || selectedDays.length === 0) return;
        const updated = { ...shifts };
        selectedDays.forEach(day => {
          const key = `2026-11-${String(day).padStart(2, '0')}`;
          if (!updated[key]) updated[key] = [];
          updated[key].push({ id: 's_' + Date.now() + '_' + Math.random(), userId: u.id, userName: `${u.rank} ${u.name}`, shiftType });
        });
        setShifts(updated);
        setSelectedDays([]);
        alert('Shifts published to department roster!');
      };

      const handleApprove = (userId) => {
        setUsers(users.map(u => u.id === userId ? { ...u, status: 'approved' } : u));
      };

      const handleDeleteUser = (userId) => {
        if (confirm('Permanently remove officer from database?')) {
          setUsers(users.filter(u => u.id !== userId));
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-6">
            <h3 className="text-base font-bold text-cyan-300 mb-4">Pending Registrations</h3>
            {users.filter(u => u.status === 'pending').map(u => (
              <div key={u.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between mb-2">
                <div className="text-xs">{u.rank} {u.name} (Badge: {u.badge})</div>
                <div className="flex gap-2">
                  <button onClick={() => handleApprove(u.id)} className="px-3 py-1 bg-emerald-500/20 text-emerald-300 rounded text-xs">Approve</button>
                  <button onClick={() => handleDeleteUser(u.id)} className="px-3 py-1 bg-red-500/20 text-red-300 rounded text-xs">Reject</button>
                </div>
              </div>
            ))}
          </div>

          <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-6">
            <h3 className="text-base font-bold text-cyan-300 mb-4">Schedule Shifts</h3>
            <div className="grid grid-cols-2 gap-4 mb-4">
              <select value={selectedUser} onChange={e => setSelectedUser(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100">
                {users.map(u => <option key={u.id} value={u.id}>{u.rank} {u.name} ({u.badge})</option>)}
              </select>
              <select value={shiftType} onChange={e => setShiftType(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100">
                {SHIFT_TYPES.map(s => <option key={s.id} value={s.label}>{s.label}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-7 gap-2 mb-4">
              {Array.from({ length: 30 }, (_, i) => i + 1).map(day => (
                <button key={day} onClick={() => setSelectedDays(prev => prev.includes(day) ? prev.filter(d => d !== day) : [...prev, day])} className={`p-2 rounded text-xs font-mono ${selectedDays.includes(day) ? 'bg-cyan-500 text-black font-bold' : 'bg-slate-950 border border-slate-800'}`}>
                  Nov {day}
                </button>
              ))}
            </div>
            <button onClick={handleSaveShifts} className="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs uppercase">Save Shifts</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
