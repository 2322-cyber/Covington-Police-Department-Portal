<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Covington Police Department Portal</title>

  <!-- PWA & Mobile Display Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CPD Portal">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #111827;
      --accent-blue: #3b82f6;
      --border-color: #1f2937;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --danger-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    header .badge { font-size: 0.75rem; color: var(--text-sub); }

    /* Main Area */
    main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Cards & Form Components */
    .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .card .title { font-weight: 600; font-size: 1rem; color: #fff; }
    .card .body-text { font-size: 0.9rem; color: var(--text-main); }
    .card .meta { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }
    .card .urgent-tag { position: absolute; top: 12px; right: 12px; background: rgba(239, 68, 68, 0.2); color: var(--danger-red); border: 1px solid var(--danger-red); padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }

    input, button, textarea { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #1f2937; color: #fff; font-size: 0.9rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent-blue); }

    .action-btn { background-color: var(--accent-blue); color: #fff; border: none; font-weight: 600; cursor: pointer; text-align: center; }
    .danger-btn { background-color: var(--danger-red); color: #fff; border: none; font-weight: 600; cursor: pointer; text-align: center; }

    /* Bottom Navigation */
    nav { background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; }
    nav button { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; cursor: pointer; width: 25%; }
    nav button.active { color: var(--accent-blue); font-weight: 600; }
    nav button svg { width: 20px; height: 20px; fill: currentColor; }

    .chat-composer { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
    .hidden { display: none !important; }
  </style>

  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- App Header -->
  <header>
    <h1>CPD PORTAL</h1>
    <span class="badge" id="userBadge">OFFICER</span>
  </header>

  <!-- Dynamic Views Container -->
  <main id="appContainer">
    <div class="card">
      <div class="title">Initializing Application...</div>
    </div>
  </main>

  <!-- Navigation Bar -->
  <nav id="bottomNav" class="hidden">
    <button id="navNotices" class="active" onclick="switchTab('notices')">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      Notices
    </button>
    <button id="navSchedule" onclick="switchTab('schedule')">
      <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
      Schedule
    </button>
    <button id="navChat" onclick="switchTab('chat')">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      Chat
    </button>
    <button id="navProfile" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Profile
    </button>
  </nav>

  <script>
    // =============================================================
    // 1. CONFIGURATION & CORE INITIALIZATION
    // =============================================================
    const SUPABASE_URL = 'https://pnsrwtsqfqjjmollbtyr.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const PUBLIC_VAPID_KEY = 'YOUR_PUBLIC_VAPID_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let activeTab = 'notices';
    let currentUser = null;

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker Registered:', reg.scope))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }

    // =============================================================
    // 2. AUTHENTICATION & SESSION MANAGEMENT
    // =============================================================
    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentUser = session.user;
          document.getElementById('userBadge').innerText = currentUser.email || 'OFFICER';
          document.getElementById('bottomNav').classList.remove('hidden');
          setupRealtimeSubscriptions();
          switchTab('notices');
        } else {
          currentUser = null;
          document.getElementById('bottomNav').classList.add('hidden');
          renderLoginView();
        }
      });
    }

    function renderLoginView() {
      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="card" style="margin-top: 20px;">
          <div class="title">Officer Login</div>
          <div class="body-text">Enter your agency credentials to access the CPD Portal.</div>
          <input type="email" id="loginEmail" placeholder="officer@covingtonpd.gov">
          <input type="password" id="loginPass" placeholder="Password">
          <button class="action-btn" onclick="handleLogin()">LOGIN</button>
        </div>
      `;
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Login failed: ' + error.message);
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      localStorage.clear();
      window.location.reload();
    }

    // =============================================================
    // 3. REALTIME WEBSOCKET SUBSCRIPTIONS
    // =============================================================
    function setupRealtimeSubscriptions() {
      supabaseClient
        .channel('cpd-live-broadcast')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'cpd_chat_msgs' }, () => {
          if (activeTab === 'chat') fetchChatMessages();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'cpd_notices' }, () => {
          if (activeTab === 'notices') fetchNotices();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'cpd_schedule' }, () => {
          if (activeTab === 'schedule') fetchSchedule();
        })
        .subscribe((status) => {
          console.log('Realtime Connection Status:', status);
        });
    }

    // =============================================================
    // 4. WEB PUSH NOTIFICATION SETUP
    // =============================================================
    async function enablePushNotifications() {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert('Notification permission was denied.');
          return;
        }

        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
        });

        // Save token to Supabase user profile
        const { error } = await supabaseClient
          .from('cpd_users')
          .update({ push_subscription: subscription })
          .eq('id', currentUser.id);

        if (error) throw error;
        alert('Device successfully registered for Web Push notifications!');
      } catch (err) {
        console.error('Push Error:', err);
        alert('Push Setup Failed: ' + err.message);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // =============================================================
    // 5. VIEWS & NAVIGATION CONTROLLER
    // =============================================================
    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));

      if (tab === 'notices') {
        document.getElementById('navNotices').classList.add('active');
        fetchNotices();
      } else if (tab === 'schedule') {
        document.getElementById('navSchedule').classList.add('active');
        fetchSchedule();
      } else if (tab === 'chat') {
        document.getElementById('navChat').classList.add('active');
        fetchChatMessages();
      } else if (tab === 'profile') {
        document.getElementById('navProfile').classList.add('active');
        renderProfileView();
      }
    }

    async function fetchNotices() {
      const container = document.getElementById('appContainer');
      const { data, error } = await supabaseClient.from('cpd_notices').select('*').order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<div class="card"><div class="title">No Notices Found</div></div>';
        return;
      }

      container.innerHTML = data.map(n => `
        <div class="card">
          ${n.is_urgent ? '<span class="urgent-tag">URGENT</span>' : ''}
          <div class="title">${escapeHTML(n.title)}</div>
          <div class="body-text">${escapeHTML(n.body)}</div>
          <div class="meta">Posted by ${escapeHTML(n.posted_by || 'Admin')}</div>
        </div>
      `).join('');
    }

    async function fetchChatMessages() {
      const container = document.getElementById('appContainer');
      const { data, error } = await supabaseClient.from('cpd_chat_msgs').select('*').order('created_at', { ascending: true });

      let chatHTML = '<div style="display:flex; flex-direction:column; gap:8px;">';
      if (data && data.length > 0) {
        chatHTML += data.map(c => `
          <div class="card">
            <div class="title">${escapeHTML(c.author || 'Officer')}</div>
            <div class="body-text">${escapeHTML(c.text || c.message)}</div>
            <div class="meta">${new Date(c.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
          </div>
        `).join('');
      } else {
        chatHTML += '<div class="card"><div class="title">No messages yet.</div></div>';
      }
      chatHTML += '</div>';

      // Attach message composer
      chatHTML += `
        <div class="chat-composer">
          <input type="text" id="chatInput" placeholder="Type a message...">
          <button class="action-btn" style="width: auto;" onclick="sendChatMessage()">Send</button>
        </div>
      `;

      container.innerHTML = chatHTML;
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const { error } = await supabaseClient.from('cpd_chat_msgs').insert([
        { text: text, author: currentUser.email }
      ]);

      if (error) console.error('Error sending message:', error);
    }

    async function fetchSchedule() {
      const container = document.getElementById('appContainer');
      const { data, error } = await supabaseClient.from('cpd_schedule').select('*').order('shift_date', { ascending: true });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<div class="card"><div class="title">No Shift Schedule Available</div></div>';
        return;
      }

      container.innerHTML = data.map(s => `
        <div class="card">
          <div class="title">${escapeHTML(s.shift_name || 'Shift Assignment')}</div>
          <div class="body-text">Date: ${escapeHTML(s.shift_date)} | Hours: ${escapeHTML(s.hours)}</div>
          <div class="meta">Officer: ${escapeHTML(s.officer_name)}</div>
        </div>
      `).join('');
    }

    function renderProfileView() {
      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="card">
          <div class="title">Web Push Notifications</div>
          <div class="body-text">Receive real-time mobile push alerts for chat activity and department notices.</div>
          <button class="action-btn" onclick="enablePushNotifications()">ENABLE DEVICE NOTIFICATIONS</button>
        </div>

        <div class="card" style="margin-top: 12px; border-color: var(--danger-red);">
          <div class="title" style="color: var(--danger-red);">Session Controls</div>
          <div class="body-text">Sign out of your account on this device.</div>
          <button class="danger-btn" onclick="handleLogout()">SIGN OUT</button>
        </div>
      `;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', initAuth);
  </script>
</body>
</html>
