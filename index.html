<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Covington Police Department - Tactical Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Babel Runtime for JSX Execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Inline SVG Icon components (Zero external dependencies)
    const Shield = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    );
    const Users = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path strokeLinecap="round" strokeLinejoin="round" d="M23 21v-2a4 4 0 0 0-3-3.87"/><path strokeLinecap="round" strokeLinejoin="round" d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const CalendarIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );
    const Clock = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );
    const MessageSquare = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    );
    const Settings = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path strokeLinecap="round" strokeLinejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    );
    const Trash2 = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path strokeLinecap="round" strokeLinejoin="round" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    );
    const CheckCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const Send = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    );
    const Bell = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path strokeLinecap="round" strokeLinejoin="round" d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    );
    const AlertTriangle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );
    const ChevronLeft = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    );
    const ChevronRight = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    );
    const LogOut = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    );

    // Initial Master Personnel Data
    const INITIAL_USERS = [
      {
        id: "usr_master",
        name: "Seth Persinger",
        badge: "23-22",
        phone: "765-585-2798",
        carrier: "verizon",
        rank: "Chief",
        role: "admin",
        approved: true,
        smsEnabled: true,
        password: "admin123",
        vacationHours: 120,
        personalHours: 40,
        compHours: 32
      },
      {
        id: "usr_2",
        name: "John Davis",
        badge: "23-14",
        phone: "765-555-0144",
        carrier: "att",
        rank: "Sergeant",
        role: "officer",
        approved: true,
        smsEnabled: true,
        password: "officerpassword",
        vacationHours: 80,
        personalHours: 24,
        compHours: 16
      }
    ];

    const INITIAL_CHATS = [
      {
        id: "chat_gen",
        title: "Patrol Alpha Broadcast",
        members: ["usr_master", "usr_2"],
        messages: [
          { id: "m1", senderId: "usr_master", senderName: "Chief Seth Persinger", text: "Department wide directive: Ensure all shift logs are synced before end of watch.", time: "08:00 AM" }
        ]
      }
    ];

    const INITIAL_ANNOUNCEMENTS = [
      { id: "a1", author: "Chief Seth Persinger", title: "Mandatory Training Session", body: "Active shooter response refresher scheduled for Thursday at headquarters.", date: "2026-11-01" }
    ];

    function App() {
      const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('cpd_users')) || INITIAL_USERS);
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('cpd_current_user')) || null);
      const [shifts, setShifts] = useState(() => JSON.parse(localStorage.getItem('cpd_shifts')) || []);
      const [chats, setChats] = useState(() => JSON.parse(localStorage.getItem('cpd_chats')) || INITIAL_CHATS);
      const [announcements, setAnnouncements] = useState(() => JSON.parse(localStorage.getItem('cpd_announcements')) || INITIAL_ANNOUNCEMENTS);
      const [activeTab, setActiveTab] = useState('announcements');
      
      const [smsConfig, setSmsConfig] = useState(() => JSON.parse(localStorage.getItem('cpd_sms_config')) || {
        engine: 'carrier_gateway',
        webhookUrl: ''
      });

      useEffect(() => { localStorage.setItem('cpd_users', JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem('cpd_current_user', JSON.stringify(currentUser)); }, [currentUser]);
      useEffect(() => { localStorage.setItem('cpd_shifts', JSON.stringify(shifts)); }, [shifts]);
      useEffect(() => { localStorage.setItem('cpd_chats', JSON.stringify(chats)); }, [chats]);
      useEffect(() => { localStorage.setItem('cpd_announcements', JSON.stringify(announcements)); }, [announcements]);
      useEffect(() => { localStorage.setItem('cpd_sms_config', JSON.stringify(smsConfig)); }, [smsConfig]);

      const handleLogin = (badge, password) => {
        const found = users.find(u => u.badge === badge && u.password === password);
        if (!found) return { success: false, message: "Invalid Badge Number or Password" };
        if (!found.approved) return { success: false, message: "Account Registration Pending Approval by Admin" };
        setCurrentUser(found);
        return { success: true };
      };

      const handleRegister = (newUser) => {
        if (users.some(u => u.badge === newUser.badge)) {
          return { success: false, message: "Badge number already registered in database" };
        }
        const created = {
          ...newUser,
          id: `usr_${Date.now()}`,
          role: 'officer',
          approved: false,
          smsEnabled: true,
          vacationHours: 0,
          personalHours: 0,
          compHours: 0
        };
        setUsers([...users, created]);
        return { success: true, message: "Registration submitted! An Admin must approve your access." };
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('cpd_current_user');
      };

      if (!currentUser) {
        return <AuthScreen onLogin={handleLogin} onRegister={handleRegister} />;
      }

      return (
        <div className="min-h-screen flex flex-col bg-[#060913] text-slate-100">
          <header className="bg-[#0b1120] border-b border-slate-800 px-4 py-3 sticky top-0 z-40 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-blue-600/20 border border-blue-500/40 rounded-xl">
                <Shield className="w-6 h-6 text-blue-400" />
              </div>
              <div>
                <h1 className="font-bold text-base tracking-wide text-white">COVINGTON POLICE DEPT</h1>
                <p className="text-xs font-mono text-cyan-400 flex items-center gap-1">
                  <span>{currentUser.rank} {currentUser.name}</span>
                  <span className="text-slate-500">•</span>
                  <span className="text-slate-400">Badge #{currentUser.badge}</span>
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={handleLogout}
                className="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition"
                title="Log Out"
              >
                <LogOut className="w-5 h-5" />
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto p-4 pb-24">
            {activeTab === 'announcements' && (
              <AnnouncementsTab 
                announcements={announcements} 
                currentUser={currentUser}
                onAddAnnouncement={(newAnn) => setAnnouncements([newAnn, ...announcements])}
              />
            )}

            {activeTab === 'calendar' && (
              <CalendarTab shifts={shifts} users={users} />
            )}

            {activeTab === 'timeoff' && (
              <TimeOffTab currentUser={currentUser} />
            )}

            {activeTab === 'comms' && (
              <CommsTab 
                chats={chats}
                users={users}
                currentUser={currentUser}
                onSendMessage={(chatId, msgText) => {
                  setChats(chats.map(c => {
                    if (c.id === chatId) {
                      const updatedMsg = {
                        id: `msg_${Date.now()}`,
                        senderId: currentUser.id,
                        senderName: `${currentUser.rank} ${currentUser.name}`,
                        text: msgText,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                      };
                      return { ...c, messages: [...c.messages, updatedMsg] };
                    }
                    return c;
                  }));
                }}
              />
            )}

            {activeTab === 'settings' && (
              <SettingsTab 
                currentUser={currentUser}
                onUpdateSettings={(updatedData) => {
                  const updatedUser = { ...currentUser, ...updatedData };
                  setCurrentUser(updatedUser);
                  setUsers(users.map(u => u.id === currentUser.id ? updatedUser : u));
                }}
              />
            )}

            {activeTab === 'admin' && currentUser.role === 'admin' && (
              <AdminTab 
                users={users}
                shifts={shifts}
                chats={chats}
                smsConfig={smsConfig}
                onUpdateSmsConfig={setSmsConfig}
                onApproveUser={(userId) => setUsers(users.map(u => u.id === userId ? { ...u, approved: true } : u))}
                onRemoveUser={(userId) => {
                  if (confirm("Are you sure you want to permanently delete this officer profile?")) {
                    setUsers(users.filter(u => u.id !== userId));
                  }
                }}
                onUpdateUserBalances={(userId, vacation, personal, comp) => {
                  setUsers(users.map(u => u.id === userId ? { ...u, vacationHours: vacation, personalHours: personal, compHours: comp } : u));
                }}
                onAddShifts={(newShiftsList) => setShifts([...shifts, ...newShiftsList])}
                onWipeMonthShifts={(year, month) => {
                  setShifts(shifts.filter(s => {
                    const d = new Date(s.date);
                    return !(d.getFullYear() === year && d.getMonth() === month);
                  }));
                }}
                onCreateChatChannel={(title, memberIds) => {
                  const newChannel = {
                    id: `chat_${Date.now()}`,
                    title,
                    members: [...memberIds, currentUser.id],
                    messages: []
                  };
                  setChats([...chats, newChannel]);
                }}
              />
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-[#0b1120]/95 backdrop-blur-md border-t border-slate-800 z-40">
            <div className="max-w-md mx-auto flex justify-around py-2 px-2">
              <NavButton icon={Bell} label="Directives" active={activeTab === 'announcements'} onClick={() => setActiveTab('announcements')} />
              <NavButton icon={CalendarIcon} label="Roster" active={activeTab === 'calendar'} onClick={() => setActiveTab('calendar')} />
              <NavButton icon={Clock} label="Time Off" active={activeTab === 'timeoff'} onClick={() => setActiveTab('timeoff')} />
              <NavButton icon={MessageSquare} label="Comms" active={activeTab === 'comms'} onClick={() => setActiveTab('comms')} />
              <NavButton icon={Settings} label="Settings" active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
              {currentUser.role === 'admin' && (
                <NavButton icon={Shield} label="Admin" active={activeTab === 'admin'} onClick={() => setActiveTab('admin')} highlight />
              )}
            </div>
          </nav>
        </div>
      );
    }

    function NavButton({ icon: Icon, label, active, onClick, highlight }) {
      return (
        <button
          onClick={onClick}
          className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${
            active 
              ? (highlight ? 'text-cyan-400 bg-cyan-500/10' : 'text-blue-400 bg-blue-500/10') 
              : 'text-slate-400 hover:text-slate-200'
          }`}
        >
          <Icon className="w-5 h-5" />
          <span className="text-[10px] font-semibold mt-1">{label}</span>
        </button>
      );
    }

    function AuthScreen({ onLogin, onRegister }) {
      const [isRegistering, setIsRegistering] = useState(false);
      const [badge, setBadge] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const [regName, setRegName] = useState('');
      const [regBadge, setRegBadge] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regCarrier, setRegCarrier] = useState('verizon');
      const [regRank, setRegRank] = useState('Patrolman');
      const [regPassword, setRegPassword] = useState('');

      const handleSubmitLogin = (e) => {
        e.preventDefault();
        setError('');
        const res = onLogin(badge, password);
        if (!res.success) setError(res.message);
      };

      const handleSubmitRegister = (e) => {
        e.preventDefault();
        setError('');
        setSuccessMsg('');
        const res = onRegister({
          name: regName,
          badge: regBadge,
          phone: regPhone,
          carrier: regCarrier,
          rank: regRank,
          password: regPassword
        });
        if (!res.success) {
          setError(res.message);
        } else {
          setSuccessMsg(res.message);
          setIsRegistering(false);
          setBadge(regBadge);
        }
      };

      return (
        <div className="min-h-screen bg-[#060913] flex items-center justify-center p-4">
          <div className="w-full max-w-md bg-[#0b1120] border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 via-cyan-400 to-blue-600"></div>
            
            <div className="text-center mb-6">
              <div className="inline-flex p-3 bg-blue-600/10 border border-blue-500/30 rounded-2xl mb-3">
                <Shield className="w-10 h-10 text-blue-400" />
              </div>
              <h2 className="text-xl font-bold text-white tracking-wide">COVINGTON POLICE DEPT</h2>
              <p className="text-xs text-slate-400 font-mono mt-1">OFFICER TACTICAL SERVICE PORTAL</p>
            </div>

            {error && (
              <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-center gap-2 text-rose-400 text-xs">
                <AlertTriangle className="w-4 h-4 shrink-0" />
                <span>{error}</span>
              </div>
            )}

            {successMsg && (
              <div className="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center gap-2 text-emerald-400 text-xs">
                <CheckCircle className="w-4 h-4 shrink-0" />
                <span>{successMsg}</span>
              </div>
            )}

            {!isRegistering ? (
              <form onSubmit={handleSubmitLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Badge Number</label>
                  <input 
                    type="text" 
                    required 
                    value={badge} 
                    onChange={e => setBadge(e.target.value)}
                    placeholder="e.g. 23-22"
                    className="w-full bg-[#060913] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Password</label>
                  <input 
                    type="password" 
                    required 
                    value={password} 
                    onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-[#060913] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                </div>

                <button 
                  type="submit" 
                  className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 text-sm mt-2"
                >
                  Authenticate Personnel
                </button>

                <div className="pt-4 border-t border-slate-800 text-center">
                  <button 
                    type="button" 
                    onClick={() => { setIsRegistering(true); setError(''); }}
                    className="text-xs text-cyan-400 hover:underline font-medium"
                  >
                    New Officer? Request Account Approval
                  </button>
                </div>
              </form>
            ) : (
              <form onSubmit={handleSubmitRegister} className="space-y-3">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                  <input 
                    type="text" 
                    required 
                    value={regName} 
                    onChange={e => setRegName(e.target.value)}
                    placeholder="Officer Name"
                    className="w-full bg-[#060913] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Badge Number</label>
                    <input 
                      type="text" 
                      required 
                      value={regBadge} 
                      onChange={e => setRegBadge(e.target.value)}
                      placeholder="e.g. 23-45"
                      className="w-full bg-[#060913] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Rank</label>
                    <select 
                      value={regRank} 
                      onChange={e => setRegRank(e.target.value)}
                      className="w-full bg-[#060913] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"
                    >
                      <option value="Chief">Chief</option>
                      <option value="Assistant Chief">Assistant Chief</option>
                      <option value="Sergeant">Sergeant</option>
                      <option value="Patrolman">Patrolman</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Cell Phone Number</label>
                    <input 
                      type="tel" 
                      required 
                      value={regPhone} 
                      onChange={e => setRegPhone(e.target.value)}
                      placeholder="765-555-0100"
                      className="w-full bg-[#060913] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Carrier</label>
                    <select 
                      value={regCarrier} 
                      onChange={e => setRegCarrier(e.target.value)}
                      className="w-full bg-[#060913] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"
                    >
                      <option value="verizon">Verizon</option>
                      <option value="att">AT&T</option>
                      <option value="tmobile">T-Mobile</option>

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between bg-[#0b1120] border border-slate-800 p-4 rounded-2xl">

            <h2 className="text-base font-bold text-white font-mono uppercase tracking-wider">
              {monthNames[month]} {year}

            <button onClick={handleNextMonth} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300">

          <div className="grid grid-cols-7 gap-1.5">

              <div key={`empty_${i}`} className="h-24 bg-[#080d1a]/40 rounded-xl border border-slate-900"></div>
            ))}

            {Array.from({ length: daysInMonth }).map((_, i) => {
              const dayNum = i + 1;
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;

    }

    function OfficerRow({ user, onUpdateBalances, onRemoveUser }) {
      const [vacation, setVacation] = useState(user.vacationHours || 0);
      const [personal, setPersonal] = useState(user.personalHours || 0);
      const [comp, setComp] = useState(user.compHours || 0);

      return (
        <div className="p-3 bg-[#060913] border border-slate-800 rounded-xl text-xs space-y-2">
          <div className="flex items-center justify-between">
            <div>
              <p className="font-bold text-white">{user.rank} {user.name} <span className="text-slate-500">(Badge #{user.badge})</span></p>
              <p className="text-[10px] text-slate-500 font-mono">{user.phone} • {user.carrier.toUpperCase()}</p>
            </div>
            {user.role !== 'admin' && (
              <button onClick={() => onRemoveUser(user.id)} className="text-rose-400 hover:text-rose-300 p-1">
                <Trash2 className="w-4 h-4" />
              </button>
            )}
          </div>

          <div className="grid grid-cols-3 gap-2">
            <div>
              <span className="text-[9px] text-slate-400 block">Vacation (Hrs)</span>
              <input type="number" value={vacation} onChange={e => setVacation(Number(e.target.value))} className="w-full bg-[#0b1120] border border-slate-700 rounded px-2 py-1 text-white" />
            </div>
            <div>
              <span className="text-[9px] text-slate-400 block">Personal (Hrs)</span>
              <input type="number" value={personal} onChange={e => setPersonal(Number(e.target.value))} className="w-full bg-[#0b1120] border border-slate-700 rounded px-2 py-1 text-white" />
            </div>
            <div>
              <span className="text-[9px] text-slate-400 block">Comp (Hrs)</span>
              <input type="number" value={comp} onChange={e => setComp(Number(e.target.value))} className="w-full bg-[#0b1120] border border-slate-700 rounded px-2 py-1 text-white" />
            </div>
          </div>

          <button onClick={() => onUpdateBalances(user.id, vacation, personal, comp)} className="bg-slate-800 hover:bg-slate-700 text-cyan-400 px-3 py-1 rounded text-[10px] font-bold">
            Update Balances
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
